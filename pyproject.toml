[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-qubit"
version = "0.6.0"
description = "A software qubit in pure NumPy: physics engine, T1/T2 noise, entanglement, and a learned neural model."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "akosidave31"}]
requires-python = ">=3.9"
dependencies = ["numpy"]

[project.optional-dependencies]
test = ["pytest"]
qiskit = ["qiskit", "qiskit-aer"]
app = ["ipywidgets", "matplotlib"]

[project.urls]
Homepage = "https://github.com/akosidave31/digital-qubit"

[tool.setuptools]
packages = ["digital_qubit"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["slow: trains the full ensemble (run with --runslow)"]
