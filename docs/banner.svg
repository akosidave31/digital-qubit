    <text x="440" y="165" font-size="64" font-weight="bold" fill="#ffffff">digital_qubit</text>
    <text x="442" y="215" font-size="27">A readable quantum computer simulator in pure NumPy</text>
    <text x="442" y="255" font-size="22" fill="#c9c4f5">with neural models that learn noisy qubits from measurements</text>
