    <marker id="head" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2b84b"/>
    </marker>
  </defs>
  <rect width="1200" height="380" rx="24" fill="url(#bg)"/>
  <g transform="translate(220,190)" fill="none" stroke-linecap="round">
    <circle r="130" stroke="#8f86e8" stroke-width="3"/>
    <ellipse rx="130" ry="38" stroke="#8f86e8" stroke-width="2" stroke-dasharray="7 7" opacity="0.8"/>
    <ellipse rx="38" ry="130" stroke="#8f86e8" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.5"/>
    <line x1="0" y1="-150" x2="0" y2="150" stroke="#b9b4f2" stroke-width="1.5" opacity="0.7"/>
    <line x1="-150" y1="0" x2="150" y2="0" stroke="#b9b4f2" stroke-width="1.5" opacity="0.5"/>
    <line x1="0" y1="0" x2="72" y2="-86" stroke="#f2b84b" stroke-width="6" marker-end="url(#head)"/>
    <line x1="72" y1="-86" x2="72" y2="12" stroke="#f2b84b" stroke-width="2" stroke-dasharray="5 6" opacity="0.7"/>
    <line x1="0" y1="0" x2="72" y2="12" stroke="#f2b84b" stroke-width="2" stroke-dasharray="5 6" opacity="0.7"/>
